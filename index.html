const fixChamp=c=>{const t=String(c||'').trim(),k=norm(t);if(!k)return '';if(ALIAS[k])return ALIAS[k];if(CM[k])return CM[k];let b=null,bs=0;for(const x of CH){const q=norm(x),sc=1-lev(k,q)/Math.max(k.length,q.length);if(sc>bs){bs=sc;b=x}}return bs>=.8?b:t};
const _cc={};const canon=c=>{const k=c||'';return k in _cc?_cc[k]:(_cc[k]=fixChamp(k))};
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
function matchPlayer(name){const n=norm(name);if(!n)return null;let best=null,bs=0;S.players.forEach(p=>[p.name,...(p.names||[])].forEach(x=>{const k=norm(x);if(!k)return;const sc=1-lev(n,k)/Math.max(n.length,k.length);if(sc>bs){bs=sc;best=p.id}}));return bs>=.75?best:null}

function translateDom(){if(S.lang!=='fr')return;const w=document.createTreeWalker($('#app'),NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const v=trs(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}document.querySelectorAll('#app [placeholder],#app [title]').forEach(e=>['placeholder','title'].forEach(a=>{if(e.hasAttribute(a))e.setAttribute(a,trs(e.getAttribute(a)))}))}
const PROMPT0=`És um extrator de dados de capturas de ecrã de fim de partida de League of Legends. As imagens podem ser um resumo de série completa ou um ecrã por jogo. Agrupa por jogo (gameNumber crescente) e não dupliques o mesmo jogo.
Responde APENAS com JSON estrito (sem markdown, sem texto extra) neste schema:
{"games":[{"gameNumber":1,"winner":"blue|red|null","durationSec":number|null,"bans":{"blue":["Champion"],"red":["Champion"]},"players":[{"team":"blue|red","summoner":"string","champion":"nome inglês oficial da Data Dragon, ex. Wukong","role":"TOP|JUNGLE|MID|ADC|SUPPORT|null","kills":number|null,"deaths":number|null,"assists":number|null,"cs":number|null,"gold":number|null,"damage":number|null,"conf":{"summoner":0-1,"champion":0-1,"kills":0-1,"deaths":0-1,"assists":0-1,"cs":0-1,"gold":0-1,"damage":0-1}}],"conf":{"winner":0-1,"duration":0-1}}],"warnings":["string"]}
Regras: 10 jogadores por jogo (5 por equipa, ordem Top, Jungle, Mid, ADC, Support quando possível). A equipa vencedora é a que tem "Vitória"/"Victory". Duração mm:ss converte para segundos. Valor ilegível ou ausente = null com confiança < 0.5. Nunca inventes valores. Confiança 0 a 1 por campo. Se um jogo for ilegível, omite-o e explica em warnings.`;
const oursList=()=>[...new Set([...(S.ours||'').split(/[,\n]/).map(x=>x.trim()),...S.players.flatMap(p=>[p.name,...(p.names||[])])].filter(Boolean))];

 <select data-d="format">${Object.keys(FM).map(f=>`<option ${d.format===f?'selected':''}>${f}</option>`).join('')}</select></div>
 <div class="mu" style="margin-top:6px">Campos a amarelo têm baixa confiança ou estão por preencher. Corrige o que for preciso.</div></div>
 ${d.games.map((g,gi)=>`<div class="cd"><div class="row"><b>Jogo ${gi+1}</b><label>Nossa equipa <select data-gf="side" data-g="${gi}"><option value="blue" ${g.side==='blue'?'selected':''}>Blue</option><option value="red" ${g.side==='red'?'selected':''}>Red</option></select></label>
 <select data-gf="win" data-g="${gi}"><option value="1" ${g.win?'selected':''}>Vitória</option><option value="0" ${!g.win?'selected':''}>Derrota</option></select>
 <label>Duração <input data-gf="dur" data-g="${gi}" value="${fmtDur(g.dur)}" style="width:70px" placeholder="mm:ss"></label><button data-act="rmg" data-g="${gi}" style="margin-left:auto">Remover jogo</button></div>
 ${g.warn?`<div class="msg err">${esc(g.warn)}</div>`:''}
 <div class="sc"><table><tr><th>Equipa</th><th>Jogador</th><th>Invocador</th><th>Campeão</th><th>K</th><th>D</th><th>A</th><th>CS</th><th>Ouro</th><th>Dano</th><th></th></tr>
 ${g.p.map((p,i)=>`<tr class="${p.team}"><td>${p.team===g.side?'Nós':'Eles'}<span class="mu"> · ${RL[ROLES[g.p.slice(0,i).filter(x=>x.team===p.team).length]]||''}</span></td><td>${p.team===g.side?`<select class="${p.pid?'':'lo'}" data-g="${gi}" data-i="${i}" data-f="pid"><option value="">— ignorar —</option>${S.players.map(x=>`<option value="${x.id}" ${p.pid===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}</td><td>${inp(gi,i,p,'name')}</td><td>${chsel(gi,i,p)}</td><td>${inp(gi,i,p,'k','n')}</td><td>${inp(gi,i,p,'d','n')}</td><td>${inp(gi,i,p,'a','n')}</td><td>${inp(gi,i,p,'cs','n')}</td><td>${inp(gi,i,p,'gold','n')}</td><td>${inp(gi,i,p,'dmg','n')}</td><td style="white-space:nowrap"><button data-act="mv" data-g="${gi}" data-i="${i}" data-d="-1" title="Subir">▲</button><button data-act="mv" data-g="${gi}" data-i="${i}" data-d="1" title="Descer">▼</button></td></tr>`).join('')}</table></div></div>`).join('')}
 ${d.err?`<div class="msg err">${esc(d.err)}</div>`:''}${d.dupWarn?'<div class="msg err">Este jogo parece já existir (mesma data, campeões e duração). Carrega outra vez em “Guardar” para guardar mesmo assim.</div>':''}
 <div class="row"><button class="p big" data-act="save" ${d.busy?'disabled':''}>${d.busy?'A guardar…':'Confirmar e guardar'}</button><button data-act="addg">＋ Jogo</button><button data-act="cancel">Cancelar</button></div>`;
}

/* ---------- lógica ---------- */
function sortTeams(g){const ix=new Map(g.p.map((p,i)=>[p,i])),r=p=>{const pl=p.team===g.side&&p.pid?S.players.find(x=>x.id===p.pid):null,i=ROLES.indexOf(pl&&ROLES.includes(pl.role)?pl.role:p.role);return i<0?99:i};g.p=['blue','red'].flatMap(t=>g.p.filter(p=>p.team===t).sort((a,b)=>r(a)-r(b)||ix.get(a)-ix.get(b)))}
function assign(g){g.p.forEach(p=>{p.pid=p.team===g.side?matchPlayer(p.name):null})}
async function analyze(){
 const d=S.draft;d.busy=true;d.err='';render();
 try{
  const lim=await S.sample.limits(),max=lim.images?.maxCount||4;
  const r=await S.sample.json(mkPrompt(),{images:d.files.slice(0,max),modelTier:'complex',cache:false});
  const gs=(r.games||[]).map((x,i)=>{
   const g=blank(x.gameNumber||i+1);g.dur=x.durationSec??null;g.bans={blue:(x.bans?.blue||[]).map(fixChamp),red:(x.bans?.red||[]).map(fixChamp)};
   g.p=(x.players||[]).map(p=>({team:p.team==='red'?'red':'blue',name:p.summoner||'',champ:fixChamp(p.champion),role:p.role||null,k:p.kills,d:p.deaths,a:p.assists,cs:p.cs,gold:p.gold,dmg:p.damage,pid:null,conf:p.conf||{}}));
   const m={blue:0,red:0};g.p.forEach(p=>{if(isOurs(p.name))m[p.team]++});
   if(m.blue===m.red&&(x.ourTeam==='blue'||x.ourTeam==='red')&&m.blue+m.red>=0&&oursList().length){g.side=x.ourTeam}
   else if(m.blue===m.red){g.side='blue';g.warn='A app não encontrou os vossos nomes de invocador nesta imagem, por isso não sabe qual das duas equipas é a vossa. Escolhe abaixo em “Nossa equipa” se vocês são Blue ou Red, e depois escolhe o jogador de cada linha da vossa equipa.'}else g.side=m.blue>m.red?'blue':'red';
   g.win=x.winner?x.winner===g.side:true;if(!x.winner)g.warn+=' Vencedor não identificado, confirma o resultado.';
   assign(g);sortTeams(g);return g});
  if(!gs.length)throw {text:'Não consegui ler nenhum jogo. Tenta uma captura mais nítida ou preenche manualmente.'};
  d.games=gs;d.stage='review';d.err=(r.warnings||[]).join(' ');
 }catch(e){d.err=e.text||(e.code==='not_granted'?'Precisas de permitir que a app use o Claude.':e.code==='invalid_json'?'Não consegui ler as imagens. Tenta uma captura mais nítida ou preenche manualmente.':'Erro na análise ('+(e.code||'desconhecido')+'). Tenta de novo ou preenche manualmente.')}
 d.busy=false;render();
}
const gkey=(s,g)=>s.date+'|'+g.dur+'|'+g.p.map(p=>norm(p.champ)).sort().join(',');
const toast=(t,bad)=>{const e=$('#toast');e.textContent=trs(t);e.style.borderColor=bad?'var(--r)':'var(--ac)';e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',8000)};
window.addEventListener('unhandledrejection',e=>toast('Erro: '+(e.reason&&(e.reason.message||e.reason.code)||e.reason),1));
window.addEventListener('error',e=>toast('Erro: '+e.message,1));
const W=async(fn,label)=>{const run=()=>Promise.race([fn(),new Promise((_,r)=>setTimeout(()=>r({code:'timeout',message:'Tempo esgotado ao gravar ('+label+')'}),15000))]);try{return await run()}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*600));return await run()}throw e}};
async function save(){
 const d=S.draft;if(!d||d.busy)return;d.err='';
 try{
  if(!d.opp.trim()){d.err='Escreve o nome da equipa adversária (campo no topo da página).';toast(d.err,1);render();return window.scrollTo(0,0)}
  if(!d.games.length){d.err='Adiciona pelo menos um jogo.';toast(d.err,1);return render()}
  const cand=d.games.map(g=>gkey(d,g));
  const dup=S.series.some(x=>x.id!==d.id&&(x.games||[]).some(g=>cand.includes(gkey(x,g))));
  if(dup&&!d.dupWarn){d.dupWarn=true;toast('Este jogo parece já existir. Carrega outra vez em “Confirmar e guardar” para guardar mesmo assim.',1);return render()}
  d.busy=true;render();toast('A guardar…');
  try{const P=window.claude&&await Promise.race([claude.use('permissions'),new Promise(r=>setTimeout(()=>r(null),3000))]);if(P){const st=await P.state();if(Object.values(st).includes('prompt')){toast('Aceita o pedido de permissões do Claude para poder guardar.');await Promise.race([P.request(),new Promise(r=>setTimeout(r,30000))])}}}catch(e){}
  for(const g of d.games)for(const p of g.p){if(p.team!==g.side||p.pid||!p.name||!isOurs(p.name))continue;const m=matchPlayer(p.name);if(m){p.pid=m;continue}const id=uid(),np={name:p.name,role:ROLES.includes(p.role)?p.role:'SUB',names:[p.name]};await W(()=>S.db.doc('players/'+id).set(np),'jogador '+p.name);S.players.push({id,...np});p.pid=id}
  const shots=d.shots||[];
  const s=JSON.parse(JSON.stringify({id:d.id||uid(),date:d.date,type:d.type,format:d.format,opp:d.opp.trim(),notes:d.notes||'',shots,
   games:d.games.map((g,i)=>({n:i+1,win:g.win,side:g.side,dur:g.dur,bans:g.bans,p:g.p.map((p,k)=>({team:p.team,name:p.name,champ:fixChamp(p.champ),role:ROLES[g.p.slice(0,k).filter(x=>x.team===p.team).length]||p.role||null,k:p.k,d:p.d,a:p.a,cs:p.cs,gold:p.gold,dmg:p.dmg,pid:p.team===g.side?(p.pid||null):null}))}))}));
  toast('A guardar a série…');await W(()=>S.db.doc('series/'+s.id).set(s),'série');
  for(const g of s.games)for(const p of g.p){if(!p.pid||!p.name)continue;const pl=S.players.find(x=>x.id===p.pid);if(pl&&![pl.name,...(pl.names||[])].some(n=>norm(n)===norm(p.name))){pl.names=[...(pl.names||[]),p.name];try{await W(()=>S.db.doc('players/'+pl.id).update({names:pl.names}),'alt account')}catch(e){}}}
  const [w,l]=sres(s);let mvp=null,ms=-1;s.games.forEach(g=>g.p.forEach(p=>{if(p.team===g.side&&p.pid){const v=((+p.k||0)+(+p.a||0))/Math.max(1,+p.d||0);if(v>ms){ms=v;mvp=p}}}));
  S.msg=`${s.type==='OFFICIAL'?'Oficial':'Scrim'} vs ${s.opp} — ${w}-${l} ${w>l?'✅':w<l?'❌':'➖'}`+(mvp?` | MVP: ${pname(mvp.pid)} (${mvp.champ}, KDA ${mvp.k}/${mvp.d}/${mvp.a})`:'');
  const up=[...new Set(s.games.flatMap(g=>g.p.filter(p=>p.team===g.side&&p.pid).map(p=>pname(p.pid))))],lost=[...new Set(s.games.flatMap(g=>g.p.filter(p=>p.team===g.side&&!p.pid&&p.name).map(p=>p.name)))];
  S.msg+=' | Estatísticas atualizadas: '+(up.join(', ')||'nenhum jogador')+(lost.length?' | ⚠ Sem jogador associado: '+lost.join(', '):'');
  S.draft=null;S.tab='res';render();window.scrollTo(0,0);toast('Guardado ✓ '+S.msg);
  if(S.assets&&d.files.length){const ids=[];for(const f of d.files){try{ids.push((await Promise.race([S.assets.upload(f),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),20000))])).id)}catch(e){}}
   if(ids.length)try{await S.db.doc('series/'+s.id).update({shots:[...shots,...ids]})}catch(e){}}
 }catch(e){d.err='Não consegui guardar: '+(e&&(e.message||e.code)||'erro desconhecido')+(e&&e.code?' ['+e.code+']':'')+'. Os dados que preencheste continuam aqui, podes tentar outra vez.';d.busy=false;toast(d.err,1);render()}
}
const addFiles=fs=>{if(S.draft?.stage!=='form')return;[...fs].filter(f=>f.type.startsWith('image/')).forEach(f=>S.draft.files.push(f));render()};

/* ---------- eventos ---------- */
const mkSnap=()=>({team:S.team,at:new Date().toLocaleString('pt-PT',{dateStyle:'short',timeStyle:'short'}),players:S.players,series:S.series.map(x=>({...x,shots:[]}))});
document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
 if(a==='lang'){S.lang=el.dataset.k;try{localStorage.setItem('lol-lang',S.lang)}catch(x){}}
 else if(a==='tab'){S.tab=el.dataset.k;S.msg=''}
 else if(a==='new'){S.draft=newDraft();S.msg=''}
 else if(a==='cancel')S.draft=null;
 else if(a==='analyze')return analyze();
 else if(a==='manual'){S.draft.games=[blank(1)];S.draft.stage='review'}
 else if(a==='mv'){const g=S.draft.games[+el.dataset.g],i=+el.dataset.i,p=g.p[i],same=g.p.map((x,k)=>x.team===p.team?k:-1).filter(k=>k>=0),j=same[same.indexOf(i)+ +el.dataset.d];if(j!=null){[g.p[i],g.p[j]]=[g.p[j],g.p[i]]}}
 else if(a==='addg')S.draft.games.push(blank(S.draft.games.length+1));
 else if(a==='rmg')S.draft.games.splice(+el.dataset.g,1);
 else if(a==='save')return save();
 else if(a==='edit'){const s=S.series.find(x=>x.id===id);S.draft={...newDraft(),...JSON.parse(JSON.stringify(s)),stage:'review',files:[]}}
 else if(a==='del'||a==='delp'){if(S.armed!==id){S.armed=id}else{S.armed=null;try{await S.db.doc((a==='del'?'series/':'players/')+id).delete()}catch(x){S.msg='Sem permissão para apagar.'}}}
 else if(a==='pick'){S.pf.pid=id;S.pf.open=null}
 else if(a==='clrp'){S.pf.from='';S.pf.to=''}
 else if(a==='sort'){const k=el.dataset.k;S.pf.dir=S.pf.sort===k?-S.pf.dir:-1;S.pf.sort=k}
 else if(a==='open')S.pf.open=S.pf.open===el.dataset.k?null:el.dataset.k;
 else if(a==='addp'){await S.db.doc('players/'+uid()).set({name:'Novo jogador',role:'TOP',names:[]})}
 else if(a==='datajson'){try{await S.dl.save({filename:'data.json',data:JSON.stringify(mkSnap())});S.msg='Ficheiro data.json gerado. Substitui-o no GitHub para atualizar o site da equipa.'}catch(x){S.msg='Não consegui gerar o ficheiro ('+(x&&(x.code||x.message)||'erro')+').'}}
 else if(a==='site'){try{
  const css=document.getElementById('appcss').textContent,js=document.getElementById('appjs').textContent.replace(/<\/script/gi,'<\\/script');
  const snap=mkSnap();
  const html='<!DOCTYPE html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(S.team)+'</title><style>'+css+'</style></head><body><div id="app"></div><div id="toast"></div><script>window.SNAP='+JSON.stringify(snap).replace(/</g,'\\u003c')+';<\/script><script>'+js+'<\/script></body></html>';
  await S.dl.save({filename:'index.html',data:html});S.msg='Ficheiro index.html gerado. Publica-o uma vez no GitHub (só precisas de o fazer uma vez).'}catch(x){S.msg='Não consegui gerar o ficheiro ('+(x&&(x.code||x.message)||'erro')+').'}}
 else if(a==='export'){const data=JSON.stringify({team:S.team,players:S.players,series:S.series},null,1);try{await S.dl.save({filename:'lol-scrims-backup.json',data})}catch(x){S.msg='Exportação cancelada ou indisponível.'}}
 render();
});
document.addEventListener('input',async e=>{
 const t=e.target,D=S.draft;
 if(t.dataset.d){D[t.dataset.d]=t.value;D.dupWarn=false;return}
 if(t.dataset.gf){const g=D.games[+t.dataset.g],f=t.dataset.gf;
  if(f==='side'){g.side=t.value;g.warn='';assign(g);sortTeams(g);render()}else if(f==='win')g.win=t.value==='1';else g.dur=parseDur(t.value);return}
 if(t.dataset.f){const p=D.games[+t.dataset.g].p[+t.dataset.i],f=t.dataset.f;
  if(f==='pid'){p.pid=t.value||null;t.classList.toggle('lo',!p.pid);return}
  if(f==='champ'&&t.value==='__other__'){p.custom=true;p.champ='';render();return}
  if(f==='champ'){const im=t.parentNode.querySelector('img'),u=icon(t.value);if(im){if(u){im.src=u;im.style.visibility=''}else im.style.visibility='hidden'}}
  p[f]=['name','champ'].includes(f)?t.value:(t.value===''?null:+t.value);p.conf=p.conf||{};p.conf[f]=1;t.classList.remove('lo');D.dupWarn=false;return}
 if(t.dataset.rf){S.rf[t.dataset.rf]=t.value;render();return}
 if(t.dataset.pf){S.pf[t.dataset.pf]=t.value;S.pf.open=null;render();return}
});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.dataset.f==='champ'&&t.value!=='__other__'){t.value=fixChamp(t.value);S.draft.games[+t.dataset.g].p[+t.dataset.i].champ=t.value}
 if(t.dataset.files!==undefined){addFiles(t.files)}
 if(t.dataset.team!==undefined){S.team=t.value;try{await S.db.doc('meta/team').set({name:t.value,ours:S.ours||''})}catch(x){}}
 if(t.dataset.ours!==undefined){S.ours=t.value;try{await S.db.doc('meta/team').set({name:S.team,ours:S.ours})}catch(x){}}
 if(t.dataset.pp){const v=t.dataset.pp==='names'?t.value.split(',').map(x=>x.trim()).filter(Boolean):t.value;try{await S.db.doc('players/'+t.dataset.id).update({[t.dataset.pp]:v})}catch(x){S.msg='Sem permissão para editar.';render()}}
 if(t.dataset.import!==undefined&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());for(const p of j.players||[]){const{id,...r}=p;await S.db.doc('players/'+id).set(r)}for(const s of j.series||[])await S.db.doc('series/'+s.id).set(s);if(j.team)await S.db.doc('meta/team').set({name:j.team});S.msg='Backup importado.'}catch(x){S.msg='Ficheiro de backup inválido ou sem permissão.'}render()}
});
document.addEventListener('paste',e=>addFiles(e.clipboardData?.files||[]));
document.addEventListener('dragover',e=>{if(S.draft?.stage==='form')e.preventDefault()});
document.addEventListener('drop',e=>{if(S.draft?.stage==='form'){e.preventDefault();addFiles(e.dataTransfer.files)}});

(async()=>{
 try{S.lang=localStorage.getItem('lol-lang')||'pt'}catch(e){S.lang='pt'}
 if(window.SNAP){S.snap=true;S.can=false;S.ready=true;S.dbDone=true;const ap=d=>{S.team=d.team||S.team;S.players=d.players||[];S.series=d.series||[];window.SNAP.at=d.at||window.SNAP.at};ap(window.SNAP);render();
  try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(r.ok){ap(await r.json());render()}}catch(e){}
  return}
 const use=n=>Promise.race([window.claude?claude.use(n):null,new Promise(r=>setTimeout(()=>r(null),15000))]).catch(()=>null);
 use('sample').then(x=>{S.sample=x;render()});use('assets').then(x=>{S.assets=x});use('downloads').then(x=>{S.dl=x});
 use('user').then(u=>{S.can=u?u.can('data.write')!==false:true;render()});
 S.db=await use('db');S.dbDone=true;
 if(S.db){
  setTimeout(()=>{if(!S.ready){S.ready=true;render()}},5000);
  const done=()=>{S.ready=true;render()};
  const sub=(c,fn)=>{try{S.db.collection(c).onSnapshot(s=>{fn(s);done()},e=>{S.err=e&&e.code;done()})}catch(e){S.err=String(e);done()}};
  sub('players',s=>{S.players=s.docs.map(d=>({id:d.id,...d.data()}))});
  sub('series',s=>{S.series=s.docs.map(d=>({id:d.id,...d.data()}))});
  sub('meta',s=>{const t=s.docs.find(d=>d.id==='team');if(t){S.team=t.data().name||S.team;S.ours=t.data().ours||''}});
 }else{S.ready=true;render()}
})();
</script></body></html>
